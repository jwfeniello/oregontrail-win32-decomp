name: Progress report

# Publishes the decomp.dev progress report.
#
# The report is committed at build/report.json rather than built here. This
# repository cannot measure itself: scoring needs the two original PE images,
# Microsoft Visual C++ 4.0 to link the candidate DLL, and the Ghidra function
# inventories that supply the whole-program denominator. None of those is
# redistributable, so none is reachable from a GitHub-hosted runner.
#
# build/report.json is generated by tools/otmatch/gen_decomp_dev_report.py from
# the matcher results, and refreshed in the same commit as the source it
# describes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Validate the report
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path

          path = Path("build/report.json")
          if not path.is_file():
              sys.exit("ERROR: build/report.json is missing")

          report = json.loads(path.read_text())
          if report.get("version") != 2:
              sys.exit(f"ERROR: unexpected report version {report.get('version')!r}")

          measures = report.get("measures") or {}
          units = report.get("units") or []
          required = ("total_code", "matched_code", "total_functions",
                      "matched_functions", "total_units")
          missing = [k for k in required if k not in measures]
          if missing:
              sys.exit(f"ERROR: measures missing {missing}")
          if not units:
              sys.exit("ERROR: report contains no units")
          if measures["total_units"] != len(units):
              sys.exit("ERROR: total_units disagrees with the unit list")

          total = int(measures["total_functions"])
          matched = int(measures["matched_functions"])
          if not 0 <= matched <= total or total == 0:
              sys.exit(f"ERROR: implausible function counts {matched}/{total}")

          # Per-unit counts must add up to the headline, and the code measure
          # must too. Either disagreeing means decomp.dev would show a number
          # the project cannot reproduce.
          summed_fns = sum(int(u["measures"]["total_functions"]) for u in units)
          if summed_fns != total:
              sys.exit(f"ERROR: unit functions sum to {summed_fns}, headline says {total}")

          summed_code = sum(int(u["measures"]["total_code"]) for u in units)
          if summed_code != int(measures["total_code"]):
              sys.exit(f"ERROR: unit code sums to {summed_code}, "
                       f"headline says {measures['total_code']}")

          code_matched = int(measures["matched_code"])
          code_total = int(measures["total_code"])
          print(f"{matched}/{total} functions credited; "
                f"{code_matched}/{code_total} instructions "
                f"({code_matched / code_total * 100:.2f}%) across {len(units)} units")
          PY

      - name: Upload progress report
        uses: actions/upload-artifact@v4
        with:
          name: OREGON32_report
          path: build/report.json
          if-no-files-found: error
